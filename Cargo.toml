[workspace]
resolver = "2"
members = [
    "crates/opencalc-core",
    "crates/opencalc-app",
    "crates/opencalc-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
eframe = { version = "0.31", features = ["persistence"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
num-complex = "0.4"
serde_json = "1"
rfd = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
proptest = "1"
opencalc-core = { path = "crates/opencalc-core" }

[profile.dev.package."*"]
opt-level = 2

# A smaller, faster program to ship: thin link-time optimisation and no debug symbols.
[profile.release]
lto = "thin"
strip = true
