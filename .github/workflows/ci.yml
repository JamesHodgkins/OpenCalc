name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      # rust-toolchain.toml names the toolchain and components.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Performance budgets
        run: cargo bench -p opencalc-core --bench recalc -- --quick --check

      # The file-size rule lives in scripts/check.ps1, which is written for Windows
      # paths, so it runs there (it repeats the checks above, which is harmless).
      - name: File sizes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1

  release-build:
    name: Release build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p opencalc-ui -p opencalc-cli
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/opencalc* dist/ 2>/dev/null || true
          rm -f dist/*.d dist/*.pdb
          cp LICENSE README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: opencalc-${{ runner.os }}
          path: dist
